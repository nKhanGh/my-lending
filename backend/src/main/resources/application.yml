spring:
  application:
    name: lending-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:lending}
    username: ${DB_USERNAME:lending}
    password: ${DB_PASSWORD:lending}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

lending:
  demo-user-id: 00000000-0000-0000-0000-000000000001
  demo-password: ${DEMO_PASSWORD:DemoPass123!}
  jwt-secret: ${JWT_SECRET:}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  payment-delay-seconds: ${PAYMENT_DELAY_SECONDS:5}
  payment-failure-percent: ${PAYMENT_FAILURE_PERCENT:10}
  payment-poll-ms: ${PAYMENT_POLL_MS:1000}
  overdue-cron: ${OVERDUE_CRON:0 5 0 * * *}

