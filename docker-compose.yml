services:
  postgres:
    image: postgres:17-alpine
    container_name: mini-lending-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-lending}
      POSTGRES_USER: ${DB_USERNAME:-lending}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lending}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - lending-creditline-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lending-creditline-data:

